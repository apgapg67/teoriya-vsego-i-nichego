name: Assemble index.html from parts

on:
  push:
    branches: [main]
    paths: ['parts/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble when all parts are present
        run: |
          set -e
          n=$(ls parts/site.part* 2>/dev/null | wc -l)
          echo "parts present: $n"
          if [ "$n" -lt 8 ]; then echo 'waiting for more parts'; exit 0; fi
          cat $(ls parts/site.part* | sort) > index.html.new
          sum=$(md5sum index.html.new | cut -d' ' -f1)
          echo "md5: $sum"
          if [ "$sum" != "bcb7d775b58383567a0718c740998a73" ]; then echo 'md5 mismatch'; exit 1; fi
          mv index.html.new index.html
          git rm -r -q parts
          git add index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Assemble index.html (канон 7.2, v4)'
          git push
      - name: Trigger Pages build
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || true
